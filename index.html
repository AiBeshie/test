<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Menu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="menu-container">
  <a href="story.html" class="menu-btn story-btn" data-title="OUR STORY"></a>
<a href="rsvp.html" class="menu-btn rsvp-btn" data-title="RSVP"></a>
<a href="details.html" class="menu-btn details-btn" data-title="DETAILS"></a>
<a href="gallery.html" class="menu-btn gallery-btn" data-title="GALLERY"></a>
<a href="gifts.html" class="menu-btn gifts-btn" data-title="GIFTS"></a>
<a href="contact.html" class="menu-btn contact-btn" data-title="CONTACT"></a>

  </div>
</body>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const buttons = document.querySelectorAll(".menu-btn");

  buttons.forEach(btn => {
    // On touch, add a "hover" class
    btn.addEventListener("touchstart", (e) => {
      e.preventDefault(); // para hindi ma-trigger click agad
      btn.classList.add("hover");
    });

    // Remove hover after a short delay or on touchend
    btn.addEventListener("touchend", () => {
      setTimeout(() => {
        btn.classList.remove("hover");
      }, 500); // half a second effect
    });
  });
});
</script>


</html>
